name: Live diagnostics
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Verified mirror origin
        required: true
        default: https://annas-archive.gl
      mode:
        description: Search only, or the complete public-domain download check
        type: choice
        options: [search, download]
        default: search
      md5:
        description: Public-domain catalogue MD5 for an exact-record download check
        required: true
        default: 51d2b22ca12a8b470b51f543298b34c9
      source:
        description: Optional listed source number to isolate
        required: false
        default: ''
permissions:
  contents: read
jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.3'
      - run: uv sync --locked --no-dev --python 3.12
      - name: Inspect mirror without account credentials
        if: inputs.mode != 'download'
        env:
          ANNA_BASE_URL: ${{ inputs.base_url }}
        run: uv run --frozen --no-dev anna doctor --json
      - name: Verify the live public-domain download chain
        if: inputs.mode == 'download'
        env:
          ANNA_BASE_URL: ${{ inputs.base_url }}
          DIAGNOSTIC_MD5: ${{ inputs.md5 }}
          DIAGNOSTIC_SOURCE: ${{ inputs.source }}
        run: |
          source_args=()
          if [[ -n "$DIAGNOSTIC_SOURCE" ]]; then
            source_args=(--source "$DIAGNOSTIC_SOURCE")
          fi
          uv run --frozen --no-dev python scripts/live_smoke.py --base-url "$ANNA_BASE_URL" --md5 "$DIAGNOSTIC_MD5" --record-only --timeout 180 "${source_args[@]}"

