name: Bookfinder
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Bookfinder:
    type: application
    platform: iOS
    sources:
      - path: Bookfinder
        excludes: [catalogue.js]
      - path: Bookfinder/catalogue.js
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bowenmilner.bookfinder
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Bookfinder
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
  BookfinderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BookfinderTests
        excludes: [Fixtures]
      - path: BookfinderTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Bookfinder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bowenmilner.bookfinder.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bookfinder:
    build:
      targets:
        Bookfinder: all
        BookfinderTests: [test]
    test:
      targets: [BookfinderTests]
